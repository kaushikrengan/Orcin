<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <!-- Robot Metallic Shading Gradients in Vibrant Royal Indigo -->
    <linearGradient id="robotBody" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5" />
      <stop offset="30%" stop-color="#3730A3" />
      <stop offset="70%" stop-color="#1E1B4B" />
      <stop offset="100%" stop-color="#0B0F1C" />
    </linearGradient>
    <linearGradient id="robotSpecular" x1="0%" y1="0%" x2="50%" y2="50%">
      <stop offset="0%" stop-color="#E0E7FF" stop-opacity="0.85" />
      <stop offset="50%" stop-color="#818CF8" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#312E81" stop-opacity="0" />
    </linearGradient>
    <radialGradient id="robotHeadGrad" cx="38%" cy="32%" r="65%">
      <stop offset="0%" stop-color="#6366F1" />
      <stop offset="25%" stop-color="#4338CA" />
      <stop offset="65%" stop-color="#1E1B4B" />
      <stop offset="95%" stop-color="#0A0E1A" />
    </radialGradient>
    <radialGradient id="faceVisor" cx="50%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="85%" stop-color="#070A14" />
      <stop offset="100%" stop-color="#1E1B4B" />
    </radialGradient>
    <radialGradient id="eyeGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="30%" stop-color="#C7D2FE" />
      <stop offset="70%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#4F46E5" stop-opacity="0" />
    </radialGradient>

    <!-- Subtle Ambient Glow behind Robot -->
    <radialGradient id="robotBackGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#6366F1" stop-opacity="0.35" />
      <stop offset="50%" stop-color="#4F46E5" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#4F46E5" stop-opacity="0" />
    </radialGradient>

    <!-- Filter for Neon Glow -->
    <filter id="glowFilter" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <radialGradient id="robotFloorShadow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0.6" />
      <stop offset="60%" stop-color="#000000" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Transparent Background (No background rectangle or walls) -->

  <!-- Soft Ambient Indigo Halo strictly centered behind the robot -->
  <circle cx="400" cy="225" r="190" fill="url(#robotBackGlow)" />

  <!-- 3D LUMINA ROBOT AGENT: Positioned strictly Front & Center -->
  <g transform="translate(340, 10)">
    <!-- Base Shadow beneath Robot -->
    <ellipse cx="60" cy="405" rx="140" ry="24" fill="url(#robotFloorShadow)" />

    <!-- Robot Left Arm (Viewer's left) -->
    <g transform="translate(-50, 240)">
      <!-- Shoulder Ball -->
      <circle cx="20" cy="20" r="16" fill="url(#robotHeadGrad)" stroke="#818CF8" stroke-opacity="0.45" stroke-width="1.5" />
      <!-- Upper Arm -->
      <path d="M 10 25 C 0 50, 2 80, 14 100 C 26 85, 28 55, 26 28 Z" fill="url(#robotBody)" stroke="#4F46E5" stroke-width="1.2" />
      <!-- Forearm & Hand -->
      <ellipse cx="14" cy="115" rx="12" ry="16" fill="url(#robotHeadGrad)" />
      <circle cx="14" cy="132" r="7" fill="#312E81" />
    </g>

    <!-- Robot Right Arm (Viewer's right) -->
    <g transform="translate(130, 240)">
      <!-- Shoulder Ball -->
      <circle cx="20" cy="20" r="16" fill="url(#robotHeadGrad)" stroke="#818CF8" stroke-opacity="0.45" stroke-width="1.5" />
      <!-- Upper Arm -->
      <path d="M 28 25 C 40 50, 38 80, 26 100 C 14 85, 12 55, 14 28 Z" fill="url(#robotBody)" stroke="#4F46E5" stroke-width="1.2" />
      <!-- Forearm & Hand -->
      <ellipse cx="26" cy="115" rx="12" ry="16" fill="url(#robotHeadGrad)" />
      <circle cx="26" cy="132" r="7" fill="#312E81" />
    </g>

    <!-- Robot Torso Body in Royal Indigo Titanium -->
    <g transform="translate(0, 235)">
      <!-- Main Body Shell -->
      <path d="M -15 0 C 40 -12, 80 -12, 135 0 C 145 45, 145 105, 120 145 C 85 160, 35 160, 0 145 C -25 105, -25 45, -15 0 Z" fill="url(#robotBody)" stroke="#818CF8" stroke-opacity="0.4" stroke-width="2" />
      <!-- Specular Torso Sheen -->
      <path d="M 0 15 C 35 5, 75 5, 110 15 C 100 45, 80 75, 45 75 C 15 75, 5 45, 0 15 Z" fill="url(#robotSpecular)" opacity="0.5" />

      <!-- Glowing Chest Beacon (Royal Indigo Intelligence Unit) -->
      <g transform="translate(60, 55)">
        <!-- Outer Glowing Rim -->
        <path d="M -26 0 C -26 -16, 26 -16, 26 0 C 26 14, 0 20, 0 20 C 0 20, -26 14, -26 0 Z" fill="#0F142A" stroke="#6366F1" stroke-width="1.5" />
        <!-- Inner Core Arc in Glowing Periwinkle/Indigo -->
        <path d="M -18 2 C -18 -8, 18 -8, 18 2 C 18 9, 0 13, 0 13 C 0 13, -18 9, -18 2 Z" fill="#C7D2FE" filter="url(#glowFilter)" />
        <circle cx="0" cy="26" r="4.5" fill="#818CF8" filter="url(#glowFilter)" />
      </g>

      <!-- Mechanical segmented waist rings -->
      <path d="M 8 135 C 35 145, 85 145, 112 135 L 108 152 C 80 162, 40 162, 12 152 Z" fill="#1E1B4B" stroke="#6366F1" stroke-opacity="0.45" stroke-width="1" />
      <path d="M 18 152 C 40 160, 80 160, 102 152 L 98 165 C 75 172, 45 172, 22 165 Z" fill="#131735" stroke="#6366F1" stroke-opacity="0.35" stroke-width="1" />
    </g>

    <!-- Robot Neck Joint -->
    <path d="M 38 215 C 45 205, 75 205, 82 215 L 86 240 C 70 245, 50 245, 34 240 Z" fill="#181D3D" stroke="#6366F1" stroke-width="1" />

    <!-- Robot Head (Smooth Cybernetic Helmet in Royal Indigo) -->
    <g transform="translate(60, 120)">
      <!-- Outer Helmet Shell -->
      <ellipse cx="0" cy="0" rx="108" ry="102" fill="url(#robotHeadGrad)" stroke="#A5B4FC" stroke-opacity="0.5" stroke-width="2.5" />
      <!-- Specular Helmet Rim Highlight -->
      <path d="M -85 -35 C -65 -85, 30 -95, 80 -45 C 50 -75, -20 -80, -85 -35 Z" fill="url(#robotSpecular)" opacity="0.7" />

      <!-- Headphone / Ear Cylinders (Left & Right) in Indigo -->
      <!-- Left Ear Cup -->
      <g transform="translate(-112, 0)">
        <ellipse cx="0" cy="0" rx="12" ry="26" fill="#181B3C" stroke="#6366F1" stroke-width="2" />
        <ellipse cx="0" cy="0" rx="6" ry="16" fill="#312E81" />
        <circle cx="0" cy="0" r="5" fill="#818CF8" filter="url(#glowFilter)" />
      </g>
      <!-- Right Ear Cup -->
      <g transform="translate(112, 0)">
        <ellipse cx="0" cy="0" rx="12" ry="26" fill="#181B3C" stroke="#6366F1" stroke-width="2" />
        <ellipse cx="0" cy="0" rx="6" ry="16" fill="#312E81" />
        <circle cx="0" cy="0" r="5" fill="#818CF8" filter="url(#glowFilter)" />
      </g>

      <!-- Glossy Dark Glass Visor Screen -->
      <rect x="-82" y="-62" width="164" height="124" rx="55" fill="url(#faceVisor)" stroke="#6366F1" stroke-opacity="0.65" stroke-width="2" />
      <!-- Visor curved reflection highlight line -->
      <path d="M -60 -45 C -20 -60, 20 -60, 60 -45" fill="none" stroke="#FFFFFF" stroke-opacity="0.25" stroke-width="3" stroke-linecap="round" />

      <!-- Glowing Curved Happy Eyes (Vibrant Indigo / Light Periwinkle Glow) -->
      <!-- Left Eye -->
      <g transform="translate(-36, -6)">
        <path d="M -22 6 C -18 -14, 18 -14, 22 6" fill="none" stroke="#A5B4FC" stroke-width="7.5" stroke-linecap="round" filter="url(#glowFilter)" />
        <path d="M -22 6 C -18 -14, 18 -14, 22 6" fill="none" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round" />
      </g>
      <!-- Right Eye -->
      <g transform="translate(36, -6)">
        <path d="M -22 6 C -18 -14, 18 -14, 22 6" fill="none" stroke="#A5B4FC" stroke-width="7.5" stroke-linecap="round" filter="url(#glowFilter)" />
        <path d="M -22 6 C -18 -14, 18 -14, 22 6" fill="none" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round" />
      </g>

      <!-- Glowing Friendly Curved Smile in Indigo -->
      <g transform="translate(0, 30)">
        <path d="M -18 -3 C -10 12, 10 12, 18 -3" fill="none" stroke="#A5B4FC" stroke-width="5" stroke-linecap="round" filter="url(#glowFilter)" />
        <path d="M -18 -3 C -10 12, 10 12, 18 -3" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" />
      </g>

      <!-- Soft Visor Ambient Reflection -->
      <path d="M -70 20 C -50 45, 50 45, 70 20 C 50 35, -50 35, -70 20 Z" fill="#818CF8" opacity="0.1" />
    </g>
  </g>

  <!-- Ambient Micro Particles & Neural Sparks around Lumina -->
  <g fill="#A5B4FC" opacity="0.75">
    <circle cx="270" cy="180" r="2.2" filter="url(#glowFilter)" />
    <circle cx="530" cy="190" r="2.8" filter="url(#glowFilter)" />
    <circle cx="290" cy="90" r="1.8" filter="url(#glowFilter)" />
    <circle cx="510" cy="95" r="2.2" filter="url(#glowFilter)" />
    <circle cx="480" cy="330" r="2.2" filter="url(#glowFilter)" />
    <circle cx="320" cy="320" r="1.8" filter="url(#glowFilter)" />
  </g>
</svg>
